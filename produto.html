<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aulas de Segunda-feira</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #050515 0%, #11143c 40%, #2b32b2 100%);
      color: #ffffff;
      padding: 20px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
      text-align: center;
    }

    .rocket {
      font-size: 60px;
      transform: rotate(-45deg);
    }

    .header-text h1 {
      font-size: 36px;
      margin-bottom: 5px;
    }

    .header-text p {
      font-size: 26px;
    }

    .nav-buttons {
      display: flex;
      gap: 150px;
      margin-bottom: 60px;
    }

    .btn {
      padding: 15px 50px;
      border-radius: 50px;
      font-size: 22px;
      font-weight: bold;
      text-decoration: none;
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .btn-video {
      background: #2e3b9e;
      box-shadow: 0 0 20px rgba(46, 59, 158, 0.8);
    }

    .btn-slides {
      background: #0a0f1e;
      border-color: #1a237e;
    }

    main {
      text-align: center;
    }

    .big-title {
      font-size: 110px;
      color: #3b4cca;
      margin-bottom: 20px;
      font-family: 'Times New Roman', serif;
    }

    .subtitle {
      font-size: 28px;
      font-weight: bold;
      color: #a5b0f6;
      letter-spacing: 2px;
      max-width: 800px;
    }
  </style>
</head>
<body>

  <header>
    <div class="rocket">🚀</div>
    <div class="header-text">
      <h1>Olá calouro!</h1>
      <p>Aqui está disponibilizado as aulas de segunda-feira!</p>
    </div>
  </header>

  <div class="nav-buttons">
    <a href="#" class="btn btn-video">video</a>
    <a href="#" class="btn btn-slides">Slides</a>
  </div>

  <main>
    <h1 class="big-title">Aqui você</h1>
    <p class="subtitle">ENCONTRA SUAS AULA E SLIDES SOBRE O TEMA DESSE DIA, APROVEITE!</p>
  </main>

</body>
</html>
